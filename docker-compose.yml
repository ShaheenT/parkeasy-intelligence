services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parkeasy_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pei_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parkeasy_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@db:5432/parkeasy_intelligence
      DATABASE_SSL: "false"
      PEI_API_KEYS: ${PEI_API_KEYS:?Set PEI_API_KEYS in .env}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pei_pgdata:
