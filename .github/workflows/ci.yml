name: CI
on:
  push:
    branches: [main, develop, "feature/**", "production-hardening"]
  pull_request:
    branches: [main, develop]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: parkeasy_intelligence_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d parkeasy_intelligence_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/parkeasy_intelligence_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/parkeasy_intelligence_test
      PEI_API_KEYS: ci-test-key-that-is-long-enough
      CORS_ORIGINS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:migrate
      - run: npm test
      - run: npm audit --audit-level=high
